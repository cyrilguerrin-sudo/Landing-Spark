<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0D0D0D;
    --text: #FFFFFF;
    --text-soft: rgba(255, 255, 255, 0.72);
    --text-faint: rgba(255, 255, 255, 0.45);
    --stroke: rgba(255, 255, 255, 0.12);
    --yellow: #FFECAC;
    --flame: linear-gradient(90deg, #FFECAC 0%, #EB4A00 55%, #920000 100%);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
  }
  /* Lueur de Spark derrière le titre. */
  body::before {
    content: "";
    position: absolute;
    top: -20vh; left: 50%;
    width: 120vw; height: 80vh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(235, 74, 0, 0.32) 0%, rgba(146, 0, 0, 0.2) 40%, transparent 70%);
    filter: blur(40px);
    pointer-events: none;
  }
  .wrap { position: relative; max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }
  .brand svg { width: 28px; height: 42px; filter: drop-shadow(0 0 10px rgba(235, 74, 0, 0.6)); }
  .brand span { font-weight: 800; font-size: 24px; letter-spacing: -0.04em; display: inline-block; transform: skewX(-10deg); }
  header a.small { color: var(--text-soft); text-decoration: none; font-weight: 500; font-size: 15px; padding: 12px 0; }

  .hero { text-align: center; padding: 56px 0 40px; }
  h1 {
    margin: 0 auto 20px; max-width: 900px;
    font-size: clamp(44px, 9vw, 96px); line-height: 0.98; font-weight: 800; letter-spacing: -0.05em;
    transform: skewX(-10deg);
  }
  h1 em { font-style: normal; background: var(--flame); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.08em; }
  .lead { margin: 0 auto 36px; max-width: 560px; color: var(--text-soft); font-size: clamp(17px, 2.4vw, 21px); line-height: 1.5; font-weight: 500; }
  /* Badge « Télécharger dans l'App Store » (mise en page du badge officiel). */
  .store {
    display: inline-flex; align-items: center; gap: 10px;
    height: 60px; padding: 0 22px 0 18px;
    background: #000; color: #fff; text-decoration: none;
    border: 1px solid #A6A6A6; border-radius: 13px;
    box-shadow: 0 0 40px rgba(235, 74, 0, 0.25);
    transition: transform 0.25s ease;
  }
  .store:hover { transform: scale(1.04); }
  .store svg { width: 28px; height: 34px; flex: none; }
  .store span { display: flex; flex-direction: column; text-align: left; font-size: 25px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .store small { font-size: 12px; font-weight: 500; letter-spacing: 0; margin-bottom: 3px; }

  /* Les 3 fiches : côte à côte, défilement horizontal sur téléphone. */
  .screens {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
    padding: 40px 0 72px;
  }
  .screens img {
    width: 100%; height: auto; display: block;
    border-radius: 28px; border: 1px solid var(--stroke);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 60px rgba(235, 74, 0, 0.12);
  }
  @media (max-width: 760px) {
    .screens {
      grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 78%;
      overflow-x: auto; scroll-snap-type: x mandatory; gap: 14px;
      margin: 0 -16px; padding: 24px 16px 56px; scrollbar-width: none;
    }
    .screens::-webkit-scrollbar { display: none; }
    .screens img { scroll-snap-align: center; border-radius: 22px; }
  }

  footer {
    border-top: 1px solid var(--stroke); padding: 28px 0 40px;
    display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between;
    color: var(--text-faint); font-size: 14px;
  }
  footer nav { display: flex; gap: 24px; }
  footer a { color: var(--text-soft); text-decoration: none; }
  footer a:hover, header a.small:hover { color: var(--yellow); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="./" aria-label="Spark">

        <path d="M220.295 34.0514C222.278 26.3467 224.081 23.7375 227.754 20.2173C223.831 33.5744 225.682 39.0136 230.109 48.1465C232.955 54.0195 235.955 57 237.6 60.8624C239.245 64.7248 240.583 68.8288 238.614 75.2927C237.111 78.3997 235.913 79.7764 233.118 81.5572C227.986 83.8823 225.187 83.726 220.295 81.5572C214.919 78.7003 212.785 77.0876 210.22 68.7672C207.655 60.4467 208.991 56.8875 209.828 49.3211C214.036 60.5861 219.282 64.5397 221.211 60.806C223.141 57.0723 221.102 51.3451 220.423 46.8797C219.743 42.4144 219.625 38.0763 220.295 34.0514Z" fill="url(#g1)"/>
        <defs>
          <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(236.156 62.9249) rotate(-69.5998) scale(53.2525 34.6201)">
            <stop stop-color="#FFECAC"/><stop offset="0.615385" stop-color="#EB4A00"/><stop offset="1" stop-color="#7C0606"/>
          </radialGradient>
        </defs>
      </svg>
      <span>Spark</span>
    </a>
    <a class="small" href="https://apps.apple.com/fr/app/spark-temps-d%C3%A9cran-focus/id6762640608">Télécharger</a>
  </header>

  <section class="hero">
    <h1>Reprends le contrôle de ton <em>attention.</em></h1>
    <p class="lead">Spark bloque tes apps distrayantes et t'aide à atteindre tes objectifs, en solo ou entre amis.</p>

      <span><small>Télécharger dans</small>l'App Store</span>

  </section>

  <section class="screens" aria-label="Aperçu de l'app">
    <img src="assets/screen-1.jpg" width="900" height="1947" alt="Casse le scroll infini : tes apps distrayantes restent verrouillées.">
    <img src="assets/screen-2.jpg" width="900" height="1947" alt="Le focus, ça se partage : suis tes amis et leurs sessions.">
    <img src="assets/screen-3.jpg" width="900" height="1947" alt="Atteins enfin tes objectifs, en solo ou à plusieurs.">
  </section>

  <footer>
    <span>© 2026 Spark</span>
    <nav>
      <a href="privacy/">Confidentialité</a>
      <a href="mailto:cyrilguerrin@gmail.com">Contact</a>
    </nav>
  </footer>
</div>
</body>
</html>
